<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>The Order · 攻略流程图</title><link rel="stylesheet" href="graph.css"><script defer src="dagre.min.js"></script><script defer src="shape-routing.js"></script><script defer src="graph.js"></script></head>
<body><header class="toolbar"><div class="filter"><span id="routeLabel">路线</span><select id="section" hidden aria-hidden="true" tabindex="-1"></select><div class="route-picker"><button id="routeButton" type="button" role="combobox" aria-labelledby="routeLabel routeValue" aria-expanded="false" aria-controls="routeOptions" aria-haspopup="listbox"><span id="routeValue">全部路线</span><span aria-hidden="true">⌄</span></button><div id="routeOptions" role="listbox" aria-label="流程图路线" hidden></div></div></div><label class="collection-filter"><input id="hideCollections" type="checkbox">隐藏回收路线</label><span id="count" class="muted"></span><div class="tools"><button id="zoomOut" aria-label="缩小流程图">−</button><button id="zoomIn" aria-label="放大流程图">＋</button><button id="width">适应宽度</button><button id="fit">总览</button><button id="reset">100%</button></div></header>
<main><section id="stage" tabindex="0" aria-label="攻略流程图，拖动平移，滚轮缩放"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="攻略节点与选项连线"><defs id="defs"></defs><g id="viewport"></g></svg></section><aside id="inspector" aria-label="所选攻略内容"><div class="inspector-title"><strong id="selectionTitle">阅读流程</strong><button id="closeInspector" aria-label="关闭所选内容">×</button></div><div id="selectionBody"><p class="muted">选择存档或结局查看关联路线；选择连线上的选项数量，查看这一段的攻略。</p></div></aside></main>
<p id="notice" class="notice" hidden></p></body></html>
